study:
  name: simple_mlp
  kind: comparison
  metadata:
    intent: torch_mlp_smoke

benchmark:
  source: sklearn
  suite: classification
  valid_size: 0.2

methods:
  - name: simple_mlp
    transform:
      policy: neural_default
    model:
      kind: simple_mlp
      backend: torch
      params:
        hidden_dims: [32, 16]
        dropout: 0.4
    fit:
      batch_size: 32
      max_epochs: 5
      optimizer:
        name: adam
        lr: 0.001
      hp_scheduler:
        name: linear
        end_factor: 0.25
      tracking:
        log_test_metrics: true
      checkpoint:
        enabled: true
        dir: ${hydra:runtime.output_dir}/checkpoints
        save_last: true
        save_best: true
    metadata:
      factor.family: neural
      factor.estimator: MLP

seeds:
  - 0

execution:
  executor: sequential
  show_progress: true
  artifact_dir: ${hydra:runtime.output_dir}/artifacts
  summary_csv: ${hydra:runtime.output_dir}/summary.csv
  summary_json: ${hydra:runtime.output_dir}/summary.json
  summary_markdown: ${hydra:runtime.output_dir}/summary.md
  aggregate_csv: ${hydra:runtime.output_dir}/aggregate.csv
  aggregate_json: ${hydra:runtime.output_dir}/aggregate.json
  aggregate_markdown: ${hydra:runtime.output_dir}/aggregate.md

logger:
  backend: mlflow
