study:
  name: tabm_comparison
  kind: comparison
  metadata:
    intent: torch_tabular_model_comparison

benchmark:
  source: sklearn
  suite: classification

methods:
  - name: mlp
    transform:
      policy: neural_default
    model:
      kind: simple_mlp
      backend: torch
      params:
        hidden_dims: [64, 64]
        dropout: 0.1
    fit:
      batch_size: 32
      max_epochs: 5
      validation_fraction: 0.2
      optimizer:
        name: adam
        lr: 0.001
      tracking:
        log_test_metrics: true
        store_history: true
      checkpoint:
        enabled: true
        dir: ${hydra:runtime.output_dir}/checkpoints
        save_last: true
        save_best: true
    metadata:
      factor.family: neural
      factor.model: MLP

  - name: tabm
    transform:
      policy: neural_default
    model:
      kind: tabm
      backend: torch
      params:
        k: 8
        n_blocks: 2
        d_block: 64
        dropout: 0.1
    fit:
      batch_size: 32
      max_epochs: 5
      validation_fraction: 0.2
      optimizer:
        name: adam
        lr: 0.001
      tracking:
        log_test_metrics: true
        store_history: true
      checkpoint:
        enabled: true
        dir: ${hydra:runtime.output_dir}/checkpoints
        save_last: true
        save_best: true
    metadata:
      factor.family: neural
      factor.model: TabM

seeds:
  - 0

execution:
  executor: sequential
  show_progress: true
  prediction_dir: ${hydra:runtime.output_dir}/predictions
  summary_csv: ${hydra:runtime.output_dir}/summary.csv
  summary_json: ${hydra:runtime.output_dir}/summary.json
  summary_markdown: ${hydra:runtime.output_dir}/summary.md
  aggregate_csv: ${hydra:runtime.output_dir}/aggregate.csv
  aggregate_json: ${hydra:runtime.output_dir}/aggregate.json
  aggregate_markdown: ${hydra:runtime.output_dir}/aggregate.md

subgroup_report:
  enabled: false
  columns: []
  min_count: 1
  csv: ${hydra:runtime.output_dir}/subgroups.csv
  json: ${hydra:runtime.output_dir}/subgroups.json
  markdown: ${hydra:runtime.output_dir}/subgroups.md

logger:
  backend: mlflow
  experiment_name: tabm-comparison
