study:
  name: classic-mil-comparison
  kind: comparison
  metadata:
    intent: compare fixed, prediction, and learned bag aggregation

benchmark:
  source: classic_mil
  datasets: [elephant, fox, tiger]
  n_folds: 5
  valid_size: 0.2
  seed: 0

methods:
  - name: BagFeatureAggregation
    transform:
      aggregation:
        policy: summary_default
      policy: linear_default
    model:
      kind: logistic_regression
      backend: sklearn
    metadata:
      factor.family: bag_feature_aggregation
      factor.estimator: LogisticRegression

  - name: InstancePoolingClassifier
    transform:
      policy: linear_default
    model:
      kind: instance_pooling_classifier
      backend: sklearn
      params:
        pooling: max
    metadata:
      factor.family: instance_pooling_classifier
      factor.estimator: LogisticRegression
      factor.pooling: max

  - name: MI-SVM
    transform:
      policy: linear_default
    model:
      kind: binary_mi_svm
      backend: sklearn
      params:
        kernel: rbf
        C: 1.0
        max_iterations: 50
    metadata:
      factor.family: mi_svm
      factor.kernel: rbf

  - name: AttentionDeepMIL
    transform:
      policy: neural_default
    model:
      kind: attention_deep_mil
      backend: torch
      params:
        encoder_dims: [128]
        embedding_dim: 128
        attention_dim: 64
        attention: plain
    fit:
      batch_size: 32
      max_epochs: 50
      early_stopping_patience: 5
      optimizer:
        name: adam
        lr: 0.001
    metadata:
      factor.family: attention_deep_mil
      factor.attention: plain

  - name: GatedAttentionDeepMIL
    transform:
      policy: neural_default
    model:
      kind: attention_deep_mil
      backend: torch
      params:
        encoder_dims: [128]
        embedding_dim: 128
        attention_dim: 64
        attention: gated
    fit:
      batch_size: 32
      max_epochs: 50
      early_stopping_patience: 5
      optimizer:
        name: adam
        lr: 0.001
    metadata:
      factor.family: attention_deep_mil
      factor.attention: gated

seeds:
  - 0

execution:
  executor: sequential
  show_progress: true
  artifact_dir: ${hydra:runtime.output_dir}/artifacts
  summary_csv: ${hydra:runtime.output_dir}/summary.csv
  summary_json: ${hydra:runtime.output_dir}/summary.json
  aggregate_csv: ${hydra:runtime.output_dir}/aggregate.csv
  aggregate_json: ${hydra:runtime.output_dir}/aggregate.json

logger:
  backend: mlflow
